name: Crypto Arbitrage Scanner (10-Min Cron)

on:
  schedule:
    # 严格按照每 10 分钟执行一次 (Public Repo 完全免费，无配额限制)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持在 GitHub Web 界面随时手动点击触发执行

jobs:
  arbitrage-scan:
    name: Run Arbitrage Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 防卡死保底机制

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Arbitrage Inspection Cycle
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || 'https://arb-mcp.kutear.com/mcp' }}
        run: |
          python arbitrage_scanner.py --once
