name: Crypto Arbitrage Scanner (10-Min Cron via uv)

on:
  schedule:
    # 严格按照每 10 分钟执行一次 (Public Repo 完全免费，无配额限制)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持在 GitHub Web 界面随时手动点击触发执行

jobs:
  arbitrage-scan:
    name: Run Arbitrage Inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 防卡死保底机制

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Execute Arbitrage Inspection via uv
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL || 'https://arb-mcp.kutear.com/mcp' }}
        run: |
          uv run arbitrage_scanner.py --once
